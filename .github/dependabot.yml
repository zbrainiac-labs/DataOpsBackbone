version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/github-runner"
    schedule:
      interval: "monthly"
    ignore:
      # Stay on Java LTS; major jumps (e.g. 21 -> 25) are done manually
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/sonarqube"
    schedule:
      interval: "monthly"
  # postgres, nginx, otel-collector, victoria-traces/-metrics, grafana in
  # docker-compose.yml (brainiac/* are built here). Run local-ci/observability-smoke.sh
  # on every observability bump (VictoriaTraces is pre-1.0: minors may break).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # A Postgres major upgrade needs a data migration (pg_upgrade/dump)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Grafana majors can change dashboard JSON/provisioning; upgrade manually
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]
      - dependency-name: "brainiac/*"
# Not covered by any bot: tool ARGs in github-runner/Dockerfile (see comment there).
