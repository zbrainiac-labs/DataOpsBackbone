# ======================================================
#        REUSABLE DATAOPS PIPELINE WORKFLOW
# ======================================================
#
# Master workflow for all DataOps projects.
# Called by consumer repos via:
#   uses: zbrainiac-labs/DataOpsBackbone/.github/workflows/dataops-pipeline.yml@main
#
# Pipeline Jobs:
#   1. prepare  — validate inputs, setup auth, pre-deploy
#   2. scan     — dependencies, SQLFluff, SonarQube, Quality Gate
#   3. deploy   — clone (optional), DCM deploy, post-deploy, scripts
#   4. validate — SQL validation tests
#   5. cleanup  — drop clone schema (always runs if clone enabled)
#   6. release  — deploy to original, package, GitHub release, summary
#
# ======================================================

name: DataOps Pipeline

permissions:
  id-token: write
  contents: write
  actions: read
  checks: write

on:
  workflow_call:
    inputs:
      SOURCE_DATABASE:
        required: true
        type: string
        description: 'Snowflake database name'
      SOURCE_SCHEMA:
        required: true
        type: string
        description: 'Snowflake schema name'
      DCM_PROJECT_IDENTIFIER:
        required: true
        type: string
        description: 'DCM project identifier (db.schema.project)'
      DCM_TARGET:
        type: string
        default: 'DEV'
        description: 'DCM target environment'
      QUALITY_GATE_ENFORCED:
        type: boolean
        default: false
        description: 'Fail pipeline on Quality Gate failure'
      CLONE_PER_BUILD:
        type: boolean
        default: false
        description: 'Clone schema per build for isolated regression testing'
      SQLFLUFF_FAIL_THRESHOLD:
        type: number
        default: 0
        description: 'Number of critical SQLFluff violations that will fail the build (0 = never fail)'
      DRY_RUN:
        type: boolean
        default: false
        description: 'Run scan and analysis only, skip deployment and release'
      USE_OIDC:
        type: boolean
        default: true
        description: 'Use OIDC workload identity for Snowflake auth (false = SNOW_CONFIG_B64 fallback)'
      SNOWFLAKE_ACCOUNT:
        type: string
        required: false
        description: 'Snowflake account identifier. Required when USE_OIDC=true. When USE_OIDC=false, uses the Snowflake CLI configured default connection.'
    secrets:
      SNOW_CONFIG_B64:
        required: true

concurrency:
  group: dataops-${{ github.ref }}-${{ inputs.SOURCE_DATABASE }}-${{ inputs.SOURCE_SCHEMA }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: PREPARE — validate, auth, pre-deploy
  # ============================================================
  prepare:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      connection_name: ${{ steps.sf.outputs.connection-name }}
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
      DCM_PROJECT_IDENTIFIER: ${{ inputs.DCM_PROJECT_IDENTIFIER }}
      DCM_TARGET: ${{ inputs.DCM_TARGET }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Show repo info
        run: |
          set -Eeuo pipefail
          echo "PIPELINE_START=$(date +%s)" >> $GITHUB_ENV
          echo "Project: $PROJECT_KEY"
          echo "Branch: ${{ github.ref_name }}"
          echo "Release #: ${{ github.run_number }}"
          echo "DCM Project: $DCM_PROJECT_IDENTIFIER"
          echo "Database: $SOURCE_DATABASE"
          echo "Schema: $SOURCE_SCHEMA"
          echo "DRY_RUN: ${{ inputs.DRY_RUN }}"

      - name: Validate inputs
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_DATABASE" =~ ^[A-Z0-9_]+$ ]] || { echo "::error::Invalid SOURCE_DATABASE: $SOURCE_DATABASE"; exit 1; }
          [[ "$SOURCE_SCHEMA" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Invalid SOURCE_SCHEMA: $SOURCE_SCHEMA"; exit 1; }
          [[ "$DCM_PROJECT_IDENTIFIER" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "::error::Invalid DCM_PROJECT_IDENTIFIER: $DCM_PROJECT_IDENTIFIER"; exit 1; }
          if [[ "${{ inputs.USE_OIDC }}" == "true" && -z "${{ inputs.SNOWFLAKE_ACCOUNT }}" ]]; then
            echo "::error::SNOWFLAKE_ACCOUNT is required when USE_OIDC=true"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        id: sf
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Render and execute pre_deploy.sql
        if: ${{ !inputs.DRY_RUN }}
        run: |
          set -Eeuo pipefail
          bash /usr/local/bin/render-sql_v1.sh \
            --FILE=pre_deploy.sql \
            --TARGET=$DCM_TARGET \
            --CONNECTION_NAME=$CONNECTION_NAME

  # ============================================================
  # JOB 2: SCAN — dependencies, linting, SonarQube
  # ============================================================
  scan:
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      SONAR_BRANCH_NAME: ${{ github.ref_name }}
      SONAR_HOST: http://sonarqube:9000
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Extract dependencies
        continue-on-error: true
        run: |
          bash /usr/local/bin/snowflake-extract-dependencies_v1.sh \
            --SOURCE_DATABASE=$SOURCE_DATABASE \
            --SOURCE_SCHEMA=$SOURCE_SCHEMA \
            --CONNECTION_NAME=$CONNECTION_NAME

      - name: Run SQLFluff lint
        run: |
          set -Eeuo pipefail
          bash /usr/local/bin/sqlfluff-to-sonar.sh "$(pwd)" "$(pwd)/sqlfluff_issues.json" || true
          THRESHOLD=${{ inputs.SQLFLUFF_FAIL_THRESHOLD }}
          if [[ "$THRESHOLD" -gt 0 && -f "$(pwd)/sqlfluff_issues.json" ]]; then
            VIOLATION_COUNT=$(python3 -c "import json; d=json.load(open('sqlfluff_issues.json')); print(len([i for i in d.get('issues',[]) if i.get('severity','') == 'CRITICAL']))" 2>/dev/null || echo 0)
            echo "::notice::SQLFluff critical violations: $VIOLATION_COUNT (threshold: $THRESHOLD)"
            if [[ "$VIOLATION_COUNT" -ge "$THRESHOLD" ]]; then
              echo "::error::SQLFluff critical violations ($VIOLATION_COUNT) exceed threshold ($THRESHOLD)"
              exit 1
            fi
          fi

      - name: Run Sonar Scanner
        run: |
          set -Eeuo pipefail
          PROJECT_VERSION="v${{ github.run_number }}" bash /usr/local/bin/sonar-scanner_v2.sh

      - name: Wait for Quality Gate to complete
        timeout-minutes: 15
        continue-on-error: ${{ !inputs.QUALITY_GATE_ENFORCED }}
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # v1.2.1
        with:
          scanMetadataReportFile: '.scannerwork/report-task.txt'

  # ============================================================
  # JOB 3: DEPLOY — clone, DCM deploy, post-deploy, scripts
  # ============================================================
  deploy:
    needs: scan
    if: ${{ !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 20
    environment: ${{ inputs.DCM_TARGET }}
    outputs:
      clone_schema: ${{ steps.clone.outputs.clone_schema }}
      work_dir: ${{ steps.clone.outputs.work_dir }}
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      RELEASE_NUM: ${{ github.run_number }}
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
      DCM_PROJECT_IDENTIFIER: ${{ inputs.DCM_PROJECT_IDENTIFIER }}
      DCM_TARGET: ${{ inputs.DCM_TARGET }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Clone schema for build
        id: clone
        if: ${{ inputs.CLONE_PER_BUILD }}
        run: |
          set -Eeuo pipefail
          DCM_PROJECT_NAME=$(echo "$DCM_PROJECT_IDENTIFIER" | awk -F'.' '{print $NF}')
          CLONE_SCHEMA="${SOURCE_SCHEMA}_${RELEASE_NUM}"
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::Failed after 3 attempts: $*"; return 1; fi; echo "::warning::Attempt $n failed, retrying in $((n*10))s..."; sleep $((n*10)); done; }
          snow sql -q "CREATE OR REPLACE SCHEMA IDENTIFIER('${SOURCE_DATABASE}.${CLONE_SCHEMA}');" -c $CONNECTION_NAME
          retry snow sql -q "CREATE DCM PROJECT IF NOT EXISTS IDENTIFIER('${SOURCE_DATABASE}.${CLONE_SCHEMA}.${DCM_PROJECT_NAME}');" -c $CONNECTION_NAME
          WORK_DIR=$(mktemp -d)
          cp -r . "$WORK_DIR/"
          python3 -c "
          import yaml, os
          target = os.environ.get('DCM_TARGET')
          schema = '${CLONE_SCHEMA}'
          project = '${SOURCE_DATABASE}.${CLONE_SCHEMA}.${DCM_PROJECT_NAME}'
          with open('$WORK_DIR/manifest.yml') as f:
              m = yaml.safe_load(f)
          m['targets'][target]['project_name'] = project
          t = m.setdefault('templating', {})
          t.setdefault('defaults', {})['schema'] = schema
          cfg = t.get('configurations', {}).get(target, {})
          if cfg:
              cfg['schema'] = schema
          with open('$WORK_DIR/manifest.yml', 'w') as f:
              yaml.dump(m, f, default_flow_style=False)
          "
          if [[ -f "$WORK_DIR/sources/definitions/infrastructure.sql" ]]; then
            sed -i '/^DEFINE WAREHOUSE/,/;$/d' "$WORK_DIR/sources/definitions/infrastructure.sql"
          fi
          echo "clone_schema=${CLONE_SCHEMA}" >> $GITHUB_OUTPUT
          echo "work_dir=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "CLONE_SCHEMA=${CLONE_SCHEMA}" >> $GITHUB_ENV
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
          echo "DCM_PROJECT_IDENTIFIER=${SOURCE_DATABASE}.${CLONE_SCHEMA}.${DCM_PROJECT_NAME}" >> $GITHUB_ENV

      - name: DCM Analyze + Plan + Deploy
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::Failed after 3 attempts: $*"; return 1; fi; echo "::warning::Attempt $n failed, retrying in $((n*10))s..."; sleep $((n*10)); done; }
          retry bash /usr/local/bin/snowflake-deploy-dcm_v1.sh \
            --PROJECT_IDENTIFIER=$DCM_PROJECT_IDENTIFIER \
            --CONNECTION_NAME=$CONNECTION_NAME \
            --TARGET=$DCM_TARGET \
            --ALIAS="release-${RELEASE_NUM}-${GITHUB_RUN_ATTEMPT}" \
            --PROJECT_DIR="${WORK_DIR:-$(pwd)}"

      - name: Render and execute post_deploy.sql
        run: |
          set -Eeuo pipefail
          bash /usr/local/bin/render-sql_v1.sh \
            --FILE=post_deploy.sql \
            --TARGET=$DCM_TARGET \
            --CONNECTION_NAME=$CONNECTION_NAME

      - name: Run custom scripts
        run: |
          set -Eeuo pipefail
          if [[ -d "scripts/" ]]; then
            for script in $(ls scripts/*.sh 2>/dev/null | sort); do
              echo "Running $script..."
              bash "$script" --connection=$CONNECTION_NAME --database=$SOURCE_DATABASE --target=$DCM_TARGET
            done
          else
            echo "No scripts/ directory found, skipping."
          fi

  # ============================================================
  # JOB 4: VALIDATE — SQL tests
  # ============================================================
  validate:
    needs: deploy
    if: ${{ !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
      DCM_TARGET: ${{ inputs.DCM_TARGET }}
      CLONE_SCHEMA: ${{ needs.deploy.outputs.clone_schema }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Run SQL Validation Tests
        run: |
          set -Eeuo pipefail
          if [[ -f "sqlunit/tests.sqltest" && -f "manifest.yml" ]]; then
            bash /usr/local/bin/render-sql_v1.sh \
              --FILE=sqlunit/tests.sqltest \
              --TARGET=$DCM_TARGET \
              --CONNECTION_NAME=$CONNECTION_NAME \
              --MANIFEST=manifest.yml \
              --RENDER_ONLY=sqlunit/tests.rendered.sqltest
            TEST_FILE="$(pwd)/sqlunit/tests.rendered.sqltest"
          else
            TEST_FILE="$(pwd)/sqlunit/tests.sqltest"
          fi
          TEST_SCHEMA="${CLONE_SCHEMA:-$SOURCE_SCHEMA}"
          bash /usr/local/bin/sql_validation_v4.sh \
            --CLONE_DATABASE=$SOURCE_DATABASE \
            --CLONE_SCHEMA=$TEST_SCHEMA \
            --CONNECTION_NAME=$CONNECTION_NAME \
            --TEST_FILE="$TEST_FILE"

      - name: Convert test results for SonarQube
        run: |
          CTRF_FILE=$(find sql-unit-reports -name 'TEST_*.json' 2>/dev/null | sort | tail -1 || true)
          if [[ -n "$CTRF_FILE" ]]; then
            python3 /usr/local/bin/ctrf_to_sonar_converter.py "$CTRF_FILE" "$(pwd)/sonar_test_report.xml"
          else
            echo "No CTRF report found, skipping conversion."
          fi

  # ============================================================
  # JOB 5: CLEANUP — drop clone schema (always runs)
  # ============================================================
  cleanup:
    needs: deploy
    if: ${{ always() && inputs.CLONE_PER_BUILD && !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
      RELEASE_NUM: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Snowflake connection
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Drop clone schema
        run: |
          rm -rf "${{ needs.deploy.outputs.work_dir }}" 2>/dev/null || true
          bash /usr/local/bin/snowflake-drop-clone-schema_v3.sh \
            --SOURCE_DATABASE=$SOURCE_DATABASE \
            --SOURCE_SCHEMA=$SOURCE_SCHEMA \
            --RELEASE_NUM=$RELEASE_NUM \
            --CONNECTION_NAME=$CONNECTION_NAME

  # ============================================================
  # JOB 6: RELEASE — deploy original, package, release, summary
  # ============================================================
  release:
    needs: [validate, cleanup]
    if: ${{ always() && !inputs.DRY_RUN && needs.validate.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ inputs.DCM_TARGET }}
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      RELEASE_NUM: ${{ github.run_number }}
      SONAR_BRANCH_NAME: ${{ github.ref_name }}
      SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
      SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
      DCM_TARGET: ${{ inputs.DCM_TARGET }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: ./.github/actions/snowflake-connect
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: DCM Deploy to original
        if: ${{ inputs.CLONE_PER_BUILD }}
        run: |
          set -Eeuo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ $n -ge 3 ]; then echo "::error::Failed after 3 attempts: $*"; return 1; fi; echo "::warning::Attempt $n failed, retrying in $((n*10))s..."; sleep $((n*10)); done; }
          retry bash /usr/local/bin/snowflake-deploy-dcm_v1.sh \
            --PROJECT_IDENTIFIER=${{ inputs.DCM_PROJECT_IDENTIFIER }} \
            --CONNECTION_NAME=$CONNECTION_NAME \
            --TARGET=$DCM_TARGET \
            --ALIAS="release-${RELEASE_NUM}-${GITHUB_RUN_ATTEMPT}" \
            --PROJECT_DIR="$(pwd)"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            .scannerwork/report-task.txt
            sqlfluff_issues.json
            out/
            sqlunit/tests.rendered.sqltest
            sonar_test_report.xml

      - name: Zip source files
        run: |
          set -Eeuo pipefail
          zip -r release.zip . \
            -x '*.git*' '*.scannerwork*' 'out/*' \
               '__pycache__/*' '.pytest_cache/*' '.venv/*' \
               '*.bak' 'sqlunit/*.rendered.*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: Release ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: release.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY
          ## Deployment Summary

          | Item | Value |
          |------|-------|
          | Project | $PROJECT_KEY |
          | Branch | $SONAR_BRANCH_NAME |
          | Database | $SOURCE_DATABASE |
          | Schema | $SOURCE_SCHEMA |
          | Release | v$RELEASE_NUM |
          | DCM Target | $DCM_TARGET |
          | Clone Used | ${{ inputs.CLONE_PER_BUILD }} |
          | Dry Run | ${{ inputs.DRY_RUN }} |
          | Auth | ${{ inputs.USE_OIDC && 'OIDC' || 'SNOW_CONFIG_B64' }} |
          SUMMARY
