# ======================================================
#        REUSABLE DATAOPS PIPELINE WORKFLOW
# ======================================================
#
# Master workflow for all DataOps projects.
# Called by consumer repos via:
#   uses: zbrainiac-labs/DataOpsBackbone/.github/workflows/dataops-pipeline.yml@main
#
# Pipeline Jobs:
#   1. prepare  — validate inputs, setup auth, pre-deploy
#   2. scan     — dependencies, SQLFluff, SonarQube, Quality Gate
#   3. deploy   — clone (optional), DCM deploy, post-deploy, scripts
#   4. validate — SQL validation tests
#   5. cleanup  — drop clone schema (always runs if clone enabled)
#   6. release  — deploy to original, package, GitHub release, summary
#   7. finish   — pipeline-level trace span (always)
#
# Every `run:` step is wrapped in `otel_step` (github-runner/lib.sh, loaded via
# BASH_ENV): begin/end log lines + an OpenTelemetry span per step. Spans are only
# exported when the runner has OTEL_EXPORTER_OTLP_ENDPOINT set (fail-open).
#
# Local test without commit/push: bash local-ci/run.sh --dry-run
# ======================================================

name: DataOps Pipeline

permissions:
  id-token: write
  contents: write
  actions: read
  checks: write

on:
  workflow_call:
    inputs:
      SOURCE_DATABASE:
        required: true
        type: string
        description: 'Snowflake database name'
      SOURCE_SCHEMA:
        required: true
        type: string
        description: 'Snowflake schema name'
      DCM_PROJECT_IDENTIFIER:
        required: true
        type: string
        description: 'DCM project identifier (db.schema.project)'
      DCM_TARGET:
        type: string
        default: 'DEV'
        description: 'DCM target environment'
      QUALITY_GATE_ENFORCED:
        type: boolean
        default: false
        description: 'Fail pipeline on Quality Gate failure'
      CLONE_PER_BUILD:
        type: boolean
        default: false
        description: 'Clone schema per build for isolated regression testing'
      SQLFLUFF_FAIL_THRESHOLD:
        type: number
        default: 0
        description: 'Number of critical SQLFluff violations that will fail the build (0 = never fail)'
      DRY_RUN:
        type: boolean
        default: false
        description: 'Run scan and analysis only, skip deployment and release'
      USE_OIDC:
        type: boolean
        default: true
        description: 'Use OIDC workload identity for Snowflake auth (false = SNOW_CONFIG_B64 fallback)'
      SNOWFLAKE_ACCOUNT:
        type: string
        required: false
        description: 'Snowflake account identifier. Required when USE_OIDC=true. When USE_OIDC=false, uses the Snowflake CLI configured default connection.'
      OTEL_ENABLED:
        type: boolean
        default: true
        description: 'Emit OpenTelemetry spans per step (only if the runner has an OTLP endpoint configured)'
    secrets:
      SNOW_CONFIG_B64:
        required: true

concurrency:
  group: dataops-${{ github.ref }}-${{ inputs.SOURCE_DATABASE }}-${{ inputs.SOURCE_SCHEMA }}
  cancel-in-progress: false

env:
  PROJECT_KEY: ${{ github.event.repository.name }}
  RELEASE_NUM: ${{ github.run_number }}
  SONAR_BRANCH_NAME: ${{ github.ref_name }}
  SONAR_HOST: http://sonarqube:9000
  SOURCE_DATABASE: ${{ inputs.SOURCE_DATABASE }}
  SOURCE_SCHEMA: ${{ inputs.SOURCE_SCHEMA }}
  DCM_PROJECT_IDENTIFIER: ${{ inputs.DCM_PROJECT_IDENTIFIER }}
  DCM_TARGET: ${{ inputs.DCM_TARGET }}
  BASH_ENV: /usr/local/bin/lib.sh
  OTEL_ENABLED: ${{ inputs.OTEL_ENABLED }}
  OTEL_SERVICE_NAME: ${{ github.event.repository.name }}  # one Jaeger service per consumer repo

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # JOB 1: PREPARE — validate, auth, pre-deploy
  # ============================================================
  prepare:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      connection_name: ${{ steps.sf.outputs.connection-name }}
      pipeline_start: ${{ steps.info.outputs.pipeline_start }}
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Show repo info
        id: info
        run: |
          set -Eeuo pipefail
          echo "pipeline_start=$(date +%s%N)" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_KEY | Branch: $SONAR_BRANCH_NAME | Release #: $RELEASE_NUM"
          echo "DCM Project: $DCM_PROJECT_IDENTIFIER | Database: $SOURCE_DATABASE | Schema: $SOURCE_SCHEMA"
          echo "DRY_RUN: ${{ inputs.DRY_RUN }} | OTEL: $OTEL_ENABLED (endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-none})"

      - name: Validate inputs
        run: |
          set -Eeuo pipefail
          validate() {
            [[ "$SOURCE_DATABASE" =~ ^[A-Z0-9_]+$ ]] || { echo "::error::Invalid SOURCE_DATABASE: $SOURCE_DATABASE"; return 1; }
            [[ "$SOURCE_SCHEMA" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Invalid SOURCE_SCHEMA: $SOURCE_SCHEMA"; return 1; }
            [[ "$DCM_PROJECT_IDENTIFIER" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "::error::Invalid DCM_PROJECT_IDENTIFIER: $DCM_PROJECT_IDENTIFIER"; return 1; }
            if [[ "${{ inputs.USE_OIDC }}" == "true" && -z "${{ inputs.SNOWFLAKE_ACCOUNT }}" ]]; then
              echo "::error::SNOWFLAKE_ACCOUNT is required when USE_OIDC=true"; return 1
            fi
          }
          otel_step prepare.validate -- validate

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        id: sf
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Render and execute pre_deploy.sql
        if: ${{ !inputs.DRY_RUN }}
        run: |
          set -Eeuo pipefail
          otel_step prepare.pre_deploy -- bash /usr/local/bin/render-sql.sh \
            --FILE=pre_deploy.sql --TARGET="$DCM_TARGET" --CONNECTION_NAME="$CONNECTION_NAME"

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 2: SCAN — dependencies, linting, SonarQube
  # ============================================================
  scan:
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Extract dependencies
        continue-on-error: true
        run: |
          otel_step scan.dependencies -- bash /usr/local/bin/snowflake-extract-dependencies.sh \
            --SOURCE_DATABASE="$SOURCE_DATABASE" --SOURCE_SCHEMA="$SOURCE_SCHEMA" --CONNECTION_NAME="$CONNECTION_NAME"

      - name: Run SQLFluff lint
        run: |
          set -Eeuo pipefail
          otel_step scan.sqlfluff -- bash /usr/local/bin/sqlfluff-to-sonar.sh \
            "$(pwd)" "$(pwd)/sqlfluff_issues.json" "${{ inputs.SQLFLUFF_FAIL_THRESHOLD }}"

      - name: Run Sonar Scanner
        run: |
          set -Eeuo pipefail
          export PROJECT_VERSION="v${RELEASE_NUM}"
          otel_step scan.sonar -- bash /usr/local/bin/sonar-scan.sh

      - name: Wait for Quality Gate to complete
        timeout-minutes: 15
        continue-on-error: ${{ !inputs.QUALITY_GATE_ENFORCED }}
        run: |
          otel_step scan.quality_gate -- bash /usr/local/bin/sonar-quality-gate.sh .scannerwork/report-task.txt 300

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 3: DEPLOY — clone, DCM deploy, post-deploy, scripts
  # ============================================================
  deploy:
    needs: scan
    if: ${{ !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 20
    environment: ${{ inputs.DCM_TARGET }}
    outputs:
      clone_schema: ${{ steps.clone.outputs.clone_schema }}
      work_dir: ${{ steps.clone.outputs.work_dir }}
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Clone schema for build
        id: clone
        if: ${{ inputs.CLONE_PER_BUILD }}
        run: |
          set -Eeuo pipefail
          otel_step deploy.clone_schema -- bash /usr/local/bin/snowflake-clone-schema.sh \
            --SOURCE_DATABASE="$SOURCE_DATABASE" --SOURCE_SCHEMA="$SOURCE_SCHEMA" --RELEASE_NUM="$RELEASE_NUM" \
            --DCM_PROJECT_IDENTIFIER="$DCM_PROJECT_IDENTIFIER" --TARGET="$DCM_TARGET" --CONNECTION_NAME="$CONNECTION_NAME"

      - name: DCM Analyze + Plan + Deploy
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          otel_step deploy.dcm -- retry bash /usr/local/bin/snowflake-deploy-dcm.sh \
            --PROJECT_IDENTIFIER="$DCM_PROJECT_IDENTIFIER" --CONNECTION_NAME="$CONNECTION_NAME" \
            --TARGET="$DCM_TARGET" --ALIAS="release-${RELEASE_NUM}-${GITHUB_RUN_ATTEMPT}" \
            --PROJECT_DIR="${WORK_DIR:-$(pwd)}"

      - name: Render and execute post_deploy.sql
        run: |
          set -Eeuo pipefail
          otel_step deploy.post_deploy -- bash /usr/local/bin/render-sql.sh \
            --FILE=post_deploy.sql --TARGET="$DCM_TARGET" --CONNECTION_NAME="$CONNECTION_NAME"

      - name: Run custom scripts
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          [[ ${#scripts[@]} -gt 0 ]] || { echo "No scripts/*.sh found, skipping."; exit 0; }
          for script in "${scripts[@]}"; do
            otel_step "deploy.script.$(basename "$script" .sh)" -- \
              bash "$script" --connection="$CONNECTION_NAME" --database="$SOURCE_DATABASE" --target="$DCM_TARGET"
          done

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 4: VALIDATE — SQL tests
  # ============================================================
  validate:
    needs: deploy
    if: ${{ !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CLONE_SCHEMA: ${{ needs.deploy.outputs.clone_schema }}
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Run SQL Validation Tests
        run: |
          set -Eeuo pipefail
          TEST_FILE="$(pwd)/sqlunit/tests.sqltest"
          if [[ -f "sqlunit/tests.sqltest" && -f "manifest.yml" ]]; then
            otel_step validate.render_tests -- bash /usr/local/bin/render-sql.sh \
              --FILE=sqlunit/tests.sqltest --TARGET="$DCM_TARGET" --CONNECTION_NAME="$CONNECTION_NAME" \
              --MANIFEST=manifest.yml --RENDER_ONLY=sqlunit/tests.rendered.sqltest
            TEST_FILE="$(pwd)/sqlunit/tests.rendered.sqltest"
          fi
          otel_step validate.sql_tests -- bash /usr/local/bin/sql-validate.sh \
            --CLONE_DATABASE="$SOURCE_DATABASE" --CLONE_SCHEMA="${CLONE_SCHEMA:-$SOURCE_SCHEMA}" \
            --CONNECTION_NAME="$CONNECTION_NAME" --TEST_FILE="$TEST_FILE"

      - name: Convert test results for SonarQube
        run: |
          CTRF_FILE=$(find sql-unit-reports -name 'TEST_*.json' 2>/dev/null | sort | tail -1 || true)
          if [[ -n "$CTRF_FILE" ]]; then
            otel_step validate.ctrf_to_sonar -- python3 /usr/local/bin/ctrf_to_sonar_converter.py \
              "$CTRF_FILE" "$(pwd)/sonar_test_report.xml"
          else
            echo "No CTRF report found, skipping conversion."
          fi

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 5: CLEANUP — drop clone schema (always runs)
  # ============================================================
  cleanup:
    needs: [deploy, validate]  # never drop the clone while tests still run against it
    if: ${{ always() && inputs.CLONE_PER_BUILD && !inputs.DRY_RUN }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Snowflake connection
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: Drop clone schema
        run: |
          rm -rf "${{ needs.deploy.outputs.work_dir }}" 2>/dev/null || true
          otel_step cleanup.drop_clone -- bash /usr/local/bin/snowflake-drop-clone-schema.sh \
            --SOURCE_DATABASE="$SOURCE_DATABASE" --SOURCE_SCHEMA="$SOURCE_SCHEMA" \
            --RELEASE_NUM="$RELEASE_NUM" --CONNECTION_NAME="$CONNECTION_NAME"

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 6: RELEASE — deploy original, package, release, summary
  # ============================================================
  release:
    needs: [validate, cleanup]
    if: ${{ always() && !inputs.DRY_RUN && needs.validate.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ inputs.DCM_TARGET }}
    steps:
      - name: "Trace: job start"
        run: otel_job_begin

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Snowflake connection
        uses: zbrainiac-labs/DataOpsBackbone/.github/actions/snowflake-connect@main
        with:
          use_oidc: ${{ inputs.USE_OIDC }}
          snowflake_account: ${{ inputs.SNOWFLAKE_ACCOUNT }}
          snow_config_b64: ${{ secrets.SNOW_CONFIG_B64 }}

      - name: DCM Deploy to original
        if: ${{ inputs.CLONE_PER_BUILD }}
        run: |
          set -Eeuo pipefail
          otel_step release.dcm -- retry bash /usr/local/bin/snowflake-deploy-dcm.sh \
            --PROJECT_IDENTIFIER="$DCM_PROJECT_IDENTIFIER" --CONNECTION_NAME="$CONNECTION_NAME" \
            --TARGET="$DCM_TARGET" --ALIAS="release-${RELEASE_NUM}-${GITHUB_RUN_ATTEMPT}" --PROJECT_DIR="$(pwd)"

      - name: Upload pipeline artifacts
        if: ${{ always() && !env.ACT }}  # act's artifact server is not reachable from job containers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pipeline-logs-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            .scannerwork/report-task.txt
            sqlfluff_issues.json
            out/
            sqlunit/tests.rendered.sqltest
            sonar_test_report.xml

      - name: Zip source files
        run: |
          set -Eeuo pipefail
          otel_step release.zip -- zip -qr release.zip . \
            -x '*.git*' '*.scannerwork*' 'out/*' '__pycache__/*' '.pytest_cache/*' '.venv/*' \
               '*.bak' 'sqlunit/*.rendered.*'

      - name: Create GitHub Release
        if: ${{ !env.ACT }}  # skipped in local-ci (nektos/act)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: Release ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          files: release.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Deployment Summary

          | Item | Value |
          |------|-------|
          | Project | $PROJECT_KEY |
          | Branch | $SONAR_BRANCH_NAME |
          | Database | $SOURCE_DATABASE |
          | Schema | $SOURCE_SCHEMA |
          | Release | v$RELEASE_NUM |
          | DCM Target | $DCM_TARGET |
          | Clone Used | ${{ inputs.CLONE_PER_BUILD }} |
          | Dry Run | ${{ inputs.DRY_RUN }} |
          | Auth | ${{ inputs.USE_OIDC && 'OIDC' || 'SNOW_CONFIG_B64' }} |
          SUMMARY

      - name: "Trace: job end"
        if: always()
        run: otel_job_end "${{ job.status }}"

  # ============================================================
  # JOB 7: FINISH — pipeline-level trace span (always)
  # ============================================================
  finish:
    needs: [prepare, scan, deploy, validate, cleanup, release]
    if: ${{ always() && inputs.OTEL_ENABLED }}
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Pipeline span + queue times
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_START: ${{ needs.prepare.outputs.pipeline_start }}
          RESULTS: >-
            prepare=${{ needs.prepare.result }} scan=${{ needs.scan.result }} deploy=${{ needs.deploy.result }}
            validate=${{ needs.validate.result }} cleanup=${{ needs.cleanup.result }} release=${{ needs.release.result }}
        run: |
          STATUS=0
          [[ "$RESULTS" == *"=failure"* || "$RESULTS" == *"=cancelled"* ]] && STATUS=1
          echo "Job results: $RESULTS"
          otel_queue_spans
          otel_pipeline_end "${PIPELINE_START:-$(date +%s%N)}" "$STATUS" \
            "cicd.pipeline.result=$([[ $STATUS == 0 ]] && echo success || echo failure)" \
            "cicd.dry_run=${{ inputs.DRY_RUN }}"
