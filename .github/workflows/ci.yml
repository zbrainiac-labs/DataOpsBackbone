name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ruff mypy pytest sqlfluff pyyaml
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy sqlfluff/ github-runner/*.py
      - name: Pytest
        run: pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck github-runner/*.sh start.sh

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -t dataops-runner:ci ./github-runner
      - name: Trivy scan runner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dataops-runner:ci
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Build sonarqube image
        run: docker build -t dataops-sonarqube:ci ./sonarqube
      - name: Trivy scan sonarqube
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dataops-sonarqube:ci
          severity: CRITICAL,HIGH
          exit-code: 1
