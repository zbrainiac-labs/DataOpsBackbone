name: CI

# Verify every change; publish the Docker images only from main or a v* tag,
# and only after lint, tests, Trivy and the SonarQube quality gate have passed.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNNER_IMAGE: brainiac/local-github-runner
  SONAR_IMAGE: brainiac/sonarqube

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'  # same as the runner image (Ubuntu 26.04)
      - name: Install dependencies
        run: pip install ruff mypy pytest sqlfluff pyyaml regex types-regex
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy sqlfluff/ github-runner/*.py
      - name: Pytest
        run: pytest tests/ -v

  shell-and-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ShellCheck
        run: shellcheck github-runner/*.sh start.sh local-ci/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # Build both images, scan them, and run the repo's own SonarQube stack
  # against this checkout (same script and quality gate as local runs).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./github-runner
          load: true
          tags: ${{ env.RUNNER_IMAGE }}:latest
          cache-from: type=gha,scope=runner-amd64
          cache-to: type=gha,scope=runner-amd64,mode=max
      - name: Build SonarQube image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./sonarqube
          load: true
          tags: ${{ env.SONAR_IMAGE }}:latest
          cache-from: type=gha,scope=sonarqube-amd64
          cache-to: type=gha,scope=sonarqube-amd64,mode=max
      - name: Trivy scan runner (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.RUNNER_IMAGE }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1
      # Remaining findings are in jars shipped by SonarSource (Elasticsearch,
      # scanner) and the third-party plugins; report them, don't block on them.
      - name: Trivy scan SonarQube (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.SONAR_IMAGE }}:latest
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Start SonarQube stack
        run: |
          sudo sysctl -w vm.max_map_count=524288  # Elasticsearch inside SonarQube
          pw() { openssl rand -hex 12; }
          cat > .env <<EOF
          POSTGRES_USER=sonar
          POSTGRES_PASSWORD=$(pw)
          POSTGRES_DB=sonar
          SONAR_JDBC_USERNAME=sonar
          SONAR_ADMIN_PASS=Ci-$(pw)-Aa1!
          EOF
          echo "SONAR_JDBC_PASSWORD=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2)" >> .env
          docker compose --env-file .env up -d --wait sonarqube db
          # One-shot: `up --wait` treats it as ready once started, so run it to completion
          docker compose --env-file .env run --rm sonar-init
      - name: SonarQube quality gate
        run: bash local-ci/sonar-self-scan.sh
      - name: SonarQube logs
        if: failure()
        run: docker compose --env-file .env logs --no-color sonarqube sonar-init | tail -n 200

  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            images:
              - 'github-runner/**'
              - 'sonarqube/**'
              - '.github/workflows/ci.yml'

  # Each platform builds natively on its own runner (no QEMU) and is pushed by
  # digest; publish-manifest then joins the digests into one multi-arch tag.
  publish:
    needs: [lint-test, shell-and-workflows, images, changes]
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.images == 'true')
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        image:
          - {name: brainiac/local-github-runner, context: ./github-runner, scope: runner}
          - {name: brainiac/sonarqube, context: ./sonarqube, scope: sonarqube}
        platform:
          - {name: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {name: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ matrix.image.name }}
      - name: Build and push by digest (${{ matrix.platform.name }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }},mode=max
          provenance: true
          sbom: true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.image.scope }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - {name: brainiac/local-github-runner, scope: runner}
          - {name: brainiac/sonarqube, scope: sonarqube}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.scope }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [[ -n "$tag" ]] && args+=(-t "$tag"); done <<<"$TAGS"
          # shellcheck disable=SC2046
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ matrix.image.name }}:sha-${GITHUB_SHA::7}"
