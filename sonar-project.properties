# SonarQube analysis of the DataOpsBackbone repo itself (scripts, Python, Docker, workflows).
# Local run:  bash local-ci/sonar-self-scan.sh
sonar.projectKey=DataOpsBackbone-local
sonar.projectName=DataOpsBackbone (self-scan)
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3

# Only analyse files tracked by git (keeps .env, *.pyc, dependencies/ etc. out)
sonar.scm.provider=git

sonar.exclusions=backup/**,images/**,docs/assets/**,docs/images/**,**/*.jar,sqlfluff/lint_report.json
sonar.tests=tests
sonar.test.inclusions=tests/**

# The txt:* DataOps rules target consumer SQL. This repo contains the rule
# definitions, docs examples and intentionally bad SQL fixtures, so they would
# only report the rules matching themselves.
sonar.issue.ignore.multicriteria=dataops
sonar.issue.ignore.multicriteria.dataops.ruleKey=txt:*
sonar.issue.ignore.multicriteria.dataops.resourceKey=**/*
