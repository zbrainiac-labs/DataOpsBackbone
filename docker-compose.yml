services:
  sonarqube:
    image: brainiac/sonarqube
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - sonarnet

  db:
    image: postgres:17.11
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresql:/var/lib/postgresql/data
      # Optional SonarQube DB dump (*.sql), loaded only when the volume is created fresh
      - ./sonarqube/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sonarnet

  # One-shot: create the shared Sonar analysis token + custom rules, then exit.
  # Re-runs on every `up` and rotates the token (old one with same name is revoked).
  sonar-init:
    image: brainiac/local-github-runner
    restart: "no"
    user: root
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST: http://sonarqube:9000
      SONAR_ADMIN_PASS: ${SONAR_ADMIN_PASS}
      SONAR_ENV_FILE: /sonar/.sonar_env
      RUNNER_NAME: shared
    entrypoint: ["bash", "-c"]
    command:
      - >-
        bash /usr/local/bin/sonar-token-init.sh &&
        test -s /sonar/.sonar_env &&
        chown 1000:1000 /sonar/.sonar_env &&
        bash /usr/local/bin/sonar-rules-setup.sh
    volumes:
      - sonar_env:/sonar
    networks:
      - sonarnet

  # Ephemeral org runners: one job per registration, then a fresh one.
  runner:
    image: brainiac/local-github-runner
    restart: always
    deploy:
      replicas: 2
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    environment:
      RUNNER_SCOPE: org
      GITHUB_OWNER: ${GITHUB_ORG}
      ACCESS_TOKEN: ${GH_ORG_TOKEN}
      RUNNER_LABELS: runner-org-${GITHUB_ORG}
      SONAR_HOST: http://sonarqube:9000
      CONNECTION_NAME: ${CONNECTION_NAME}
      # Tracing is on by default; `./start.sh --no-observability` sets this empty
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-otel-collector:4317}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar_env:/sonar:ro
      - sql_unit_report:/home/docker/sql-report-vol
      - ./sql-unit-reports:/home/docker/sql-unit-reports
      - ./unitth-store:/home/docker/unitth-store
    networks:
      - sonarnet
      - otelnet

  # Pipeline observability, started by default (opt out: ./start.sh --no-observability).
  # runners -> otel-collector -> VictoriaTraces (spans) + VictoriaMetrics (spanmetrics)
  # -> Grafana http://localhost:3000. All ports bound to localhost only.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on: [victoriatraces, victoriametrics]
    ports:
      # OTLP for local-ci (act job containers can only join sonarnet)
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # health_check extension (image has no shell: checked from the host by start.sh)
      - "127.0.0.1:13133:13133"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - otelnet

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.12.1
    container_name: victoriatraces
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBSERVABILITY_RETENTION:-365d}
      - -retention.maxDiskSpaceUsageBytes=${OBSERVABILITY_MAX_DISK:-20GiB}
    ports:
      - "127.0.0.1:10428:10428"
    volumes:
      - vtdata:/storage
    networks:
      - otelnet

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBSERVABILITY_RETENTION:-365d}
      - -storage.minFreeDiskSpaceBytes=1GiB
      - -opentelemetry.usePrometheusNaming
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vmdata:/storage
    networks:
      - otelnet

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on: [victoriatraces, victoriametrics]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Read-only viewing without login; acceptable because the port is localhost-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - otelnet

  nginx-server:
    image: nginx:1.31.8-alpine
    container_name: test-unit-reports
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - sql_unit_report:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sonarnet

  # Local GitHub Actions simulation (nektos/act). Never started by `up`;
  # run on demand:  docker compose --profile local-ci run --rm local-ci [--dry-run|--full]
  local-ci:
    profiles: ["local-ci"]
    image: brainiac/local-github-runner
    hostname: local-ci
    user: root  # access to the mounted docker socket
    entrypoint: ["bash", "/workspace/DataOpsBackbone/local-ci/run.sh"]
    command: ["--dry-run"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Parent of backbone + consumer repos, mounted at a fixed path
      - ..:/workspace
    working_dir: /workspace/DataOpsBackbone
    networks:
      - sonarnet
      - otelnet

volumes:
  sonarqube_data:
  sonarqube_extensions:
  postgresql:
  sonar_env:
  vtdata:
  vmdata:
  grafanadata:

  sql_unit_report:
    name: sql_unit_report

networks:
  sonarnet:
  # Observability only: runners/local-ci -> otel-collector. SonarQube/Postgres are not on it.
  otelnet:
