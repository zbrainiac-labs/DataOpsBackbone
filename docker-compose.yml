services:
  sonarqube:
    image: brainiac/sonarqube
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - sonarnet

  db:
    image: postgres:17.11
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresql:/var/lib/postgresql/data
      # Optional SonarQube DB dump (*.sql), loaded only when the volume is created fresh
      - ./sonarqube/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sonarnet

  # One-shot: create the shared Sonar analysis token + custom rules, then exit.
  # Re-runs on every `up` and rotates the token (old one with same name is revoked).
  sonar-init:
    image: brainiac/local-github-runner
    restart: "no"
    user: root
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST: http://sonarqube:9000
      SONAR_ADMIN_PASS: ${SONAR_ADMIN_PASS}
      SONAR_ENV_FILE: /sonar/.sonar_env
      RUNNER_NAME: shared
    entrypoint: ["bash", "-c"]
    command:
      - >-
        bash /usr/local/bin/sonar-token-init.sh &&
        test -s /sonar/.sonar_env &&
        chown 1000:1000 /sonar/.sonar_env &&
        bash /usr/local/bin/sonar-rules-setup.sh
    volumes:
      - sonar_env:/sonar
    networks:
      - sonarnet

  # Ephemeral org runners: one job per registration, then a fresh one.
  runner:
    image: brainiac/local-github-runner
    restart: always
    deploy:
      replicas: 2
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    environment:
      RUNNER_SCOPE: org
      GITHUB_OWNER: ${GITHUB_ORG}
      ACCESS_TOKEN: ${GH_ORG_TOKEN}
      RUNNER_LABELS: runner-org-${GITHUB_ORG}
      SONAR_HOST: http://sonarqube:9000
      CONNECTION_NAME: ${CONNECTION_NAME}
      # Tracing is on by default; `./start.sh --no-observability` sets this empty
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-jaeger:4317}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar_env:/sonar:ro
      - sql_unit_report:/home/docker/sql-report-vol
      - ./sql-unit-reports:/home/docker/sql-unit-reports
      - ./unitth-store:/home/docker/unitth-store
    networks:
      - sonarnet
      - otelnet

  # Pipeline tracing (OpenTelemetry), started by default -> UI http://localhost:16686
  # Opt out: ./start.sh --no-observability
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: telemetry
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    user: "0"  # badger needs write access to the named volume (root-owned)
    ports:
      - "16686:16686"
      # OTLP for local-ci (act job containers can only join sonarnet); localhost only
      - "127.0.0.1:4317:4317"
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger_v2_data:/badger
    networks:
      - otelnet

  nginx-server:
    image: nginx:1.31.8-alpine
    container_name: test-unit-reports
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - sql_unit_report:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sonarnet

  # Local GitHub Actions simulation (nektos/act). Never started by `up`;
  # run on demand:  docker compose --profile local-ci run --rm local-ci [--dry-run|--full]
  local-ci:
    profiles: ["local-ci"]
    image: brainiac/local-github-runner
    hostname: local-ci
    user: root  # access to the mounted docker socket
    entrypoint: ["bash", "/workspace/DataOpsBackbone/local-ci/run.sh"]
    command: ["--dry-run"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Parent of backbone + consumer repos, mounted at a fixed path
      - ..:/workspace
    working_dir: /workspace/DataOpsBackbone
    networks:
      - sonarnet
      - otelnet

volumes:
  sonarqube_data:
  sonarqube_extensions:
  postgresql:
  sonar_env:
  jaeger_v2_data:

  sql_unit_report:
    name: sql_unit_report

networks:
  sonarnet:
  # Tracing only: runners/local-ci -> jaeger. SonarQube/Postgres are not on it.
  otelnet:
